version: "3.8"

services:
  web:
    build: .
    image: vtiger_web:local
    container_name: vtiger_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - vtiger_network

  # Vtiger scheduled jobs (Leads Google Sheet poll every 60s, workflows, etc.)
  # Without this container, cron tasks are registered but never execute.
  cron:
    image: vtiger_web:local
    container_name: vtiger_cron
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - web
    networks:
      - vtiger_network
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /var/www/html/logs
        echo "[vtiger_cron] watcher started $$(date -Is)" >> /var/www/html/logs/vtigercron.log
        while true; do
          php /var/www/html/vtigercron.php >> /var/www/html/logs/vtigercron.log 2>&1 || true
          sleep 60
        done

  db:
    image: mysql:8.0
    container_name: vtiger_db
    ports:
      - "3307:3306"
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-TDB1}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - vtiger_network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: vtiger_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      - db
    networks:
      - vtiger_network

networks:
  vtiger_network:
    driver: bridge

volumes:
  mysql_data:
    name: tdb-vtiger_mysql_data
    external: true

